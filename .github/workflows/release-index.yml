name: Add uploaded videos to Eymen Kids
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Video release tag (e.g., kids-videos-1)"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: eymen-video-catalog
  cancel-in-progress: false
jobs:
  video-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Automatically index MP4 assets from video release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 scripts/index_release_videos.py
      - name: Publish updated video list
        run: |
          if ! git diff --quiet -- video-catalog/catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add video-catalog/catalog.json
            git commit -m "videos: update catalog from published GitHub Release"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No catalog changes needed"
          fi
